name: Generar audio móvil de la guía ARY
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/generate-mobile-audio.yml'
      - 'scripts/generate-mobile-audio.mjs'
      - 'public/scripts/ary-assistant.js'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ary-mobile-audio-assets
  cancel-in-progress: false
jobs:
  render-spanish-guide:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Instalar sintetizador neuronal y codificador de audio
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python3 -m pip install --disable-pip-version-check "piper-tts==1.8.0"
          python3 -m piper.download_voices es_MX-claude-high
      - name: Generate MP3 voice clips
        run: node scripts/generate-mobile-audio.mjs
      - name: Commit static clips to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/media/ary-guide-audio/
          if git diff --cached --quiet; then
            echo "Audio clips already up to date."
          else
            git commit -m "build(audio): voz neuronal femenina mexicana para guía móvil"
            # Other CI/project commits may have landed during synthesis.
            # Rebase only; never force-push, discard or overwrite user changes.
            pushed=0
            for attempt in 1 2 3 4 5; do
              git fetch --quiet origin main
              git rebase origin/main
              if git push origin HEAD:main; then
                pushed=1
                break
              fi
              echo "main changed while generating audio; retry $attempt/5"
              sleep 2
            done
            test "$pushed" -eq 1
          fi
