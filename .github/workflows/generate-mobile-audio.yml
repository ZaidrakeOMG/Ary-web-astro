name: Generar audio móvil de la guía ARY
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/generate-mobile-audio.yml'
      - 'scripts/generate-mobile-audio.mjs'
      - 'public/scripts/ary-assistant.js'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ary-mobile-audio-assets
  cancel-in-progress: false
jobs:
  render-spanish-guide:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Install offline Spanish speech encoder
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq espeak ffmpeg
      - name: Generate MP3 voice clips
        run: node scripts/generate-mobile-audio.mjs
      - name: Commit static clips to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/media/ary-guide-audio/
          if git diff --cached --quiet; then
            echo "Audio clips already up to date."
          else
            git commit -m "build(audio): incluir guía en MP3 compatible con teléfonos"
            git push origin HEAD:main
          fi
