name: Generar lock seguro Astro 7

on:
  push:
    branches: [security/hardening-defensa-en-capas-20261015]

permissions:
  contents: write

jobs:
  lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/hardening-defensa-en-capas-20261015
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Regenerar package-lock sin ejecutar scripts de dependencias
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Guardar lock si cambio
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock ya coincide"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Seguridad: regenerar package-lock para Astro 7.4.0"
          git push origin HEAD:security/hardening-defensa-en-capas-20261015
