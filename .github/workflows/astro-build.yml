name: Compilar y comprobar Astro

on:
  push:
    branches: [main, astro-real-migracion-20261009, astro-ary-mobile-v2-20261009]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4
      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Instalar dependencias
        run: npm install --no-audit --no-fund
      - name: Construir sitio Astro
        run: npm run build
      - name: Verificar facturacion, alta e IIS
        run: npm run test:integrity
      - name: Archivar build Astro para revisión
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: grupo-ary-astro-dist
          path: dist/
          retention-days: 3
          if-no-files-found: error
