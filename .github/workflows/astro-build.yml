name: Astro Pro - navegador e IIS
on:
  push:
    branches: [main, design-pro-android-20261009]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node --check public/scripts/ary-chat.js
      - run: node --test tests/assistant-ai.test.mjs
      - run: npm run check
      - run: npm run build
      - run: npm run test:integrity
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r tests/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Browser regression with simulated billing and voice only
        run: |
          python -m http.server 4173 --directory dist > /tmp/ary-test-http.log 2>&1 &
          python tests/chat_browser_test.py
          python tests/without_voice_prompt.py browser_test.py
          python tests/without_voice_prompt.py assistant_test.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ary-browser-and-build
          path: |
            test-results/
            dist/
          include-hidden-files: true
          retention-days: 7
  windows-syntax:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node --test tests/assistant-ai.test.mjs
      - run: npm run build
      - run: npm run test:integrity
      - name: Parse PowerShell scripts and IIS XML without changing services
        shell: powershell
        run: ./tests/windows_validation.ps1
