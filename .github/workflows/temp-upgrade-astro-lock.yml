name: TEMP - regenerar lock Astro 7

on:
  push:
    branches: [security/hardening-profundo-20261015]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Regenerar package-lock con Astro 7.4.0
        run: npm install astro@7.4.0 --save-exact --package-lock-only --ignore-scripts
      - name: Verificar versión fijada
        run: node -e "const p=require('./package.json'); if(p.dependencies.astro!=='7.4.0') process.exit(1); console.log(p.dependencies.astro)"
      - name: Guardar lock en la rama de seguridad
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m "Seguridad: migrar Astro a 7.4.0"
          git push origin HEAD:security/hardening-profundo-20261015
