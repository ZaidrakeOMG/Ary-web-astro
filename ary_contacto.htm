<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Contacta a ARY Super Servicios por correo electrónico, Facebook o Instagram." />
  <meta name="theme-color" content="#B0187C" />
  <title>ARY Super Servicios | Contacto</title>
  <link rel="shortcut icon" href="favicon.ico" />

  <style>
    :root {
      --ary-magenta: #B0187C;
      --ary-magenta-2: #D72A93;
      --ary-orange: #FCB144;
      --ary-gold: #FFD36A;
      --ary-white: #FFFFFF;

      --bg: #15000E;
      --bg-2: #270319;
      --bg-3: #360723;
      --text: #FFF8FC;
      --muted: #DDB8CC;
      --line: rgba(255,255,255,.10);
      --header-h: 82px;
      --container: 1180px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
      scroll-padding-top: calc(var(--header-h) + 22px);
    }

    body {
      margin: 0;
      min-width: 320px;
      min-height: 100svh;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      font-family: "Segoe UI", system-ui, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 8% 5%, rgba(176,24,124,.25), transparent 27%),
        radial-gradient(circle at 92% 16%, rgba(252,177,68,.13), transparent 23%),
        radial-gradient(circle at 50% 82%, rgba(215,42,147,.08), transparent 34%),
        linear-gradient(180deg, #15000E 0%, #29031B 47%, #0F0008 100%);
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -5;
      pointer-events: none;
      background:
        linear-gradient(rgba(255,255,255,.018) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.018) 1px, transparent 1px);
      background-size: 72px 72px;
      mask-image: linear-gradient(to bottom, rgba(0,0,0,.88), transparent 90%);
      -webkit-mask-image: linear-gradient(to bottom, rgba(0,0,0,.88), transparent 90%);
    }

    img {
      display: block;
      max-width: 100%;
    }

    a, button {
      -webkit-tap-highlight-color: transparent;
    }

    #ary-particles {
      position: fixed;
      inset: 0;
      z-index: -3;
      width: 100%;
      height: 100%;
      pointer-events: none;
      opacity: .5;
    }

    .scroll-progress {
      position: fixed;
      z-index: 1200;
      inset: 0 auto auto 0;
      width: 0;
      height: 3px;
      background: linear-gradient(90deg, var(--ary-magenta), var(--ary-orange), var(--ary-gold));
      box-shadow: 0 0 14px rgba(252,177,68,.58);
    }

    .cursor-energy {
      position: fixed;
      z-index: 50;
      width: 280px;
      height: 280px;
      border-radius: 50%;
      pointer-events: none;
      opacity: 0;
      transform: translate(-50%, -50%);
      background:
        radial-gradient(circle,
          rgba(252,177,68,.13) 0%,
          rgba(215,42,147,.10) 31%,
          rgba(176,24,124,.04) 54%,
          transparent 74%);
      filter: blur(12px);
      mix-blend-mode: screen;
      transition: opacity .25s ease;
    }

    /* ================= HEADER ================= */
    header {
      min-height: var(--header-h);
      padding: 12px max(22px, calc((100vw - var(--container)) / 2));
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 28px;
      position: sticky;
      top: 0;
      z-index: 1000;
      border-bottom: 1px solid rgba(252,177,68,.15);
      background:
        linear-gradient(90deg,
          rgba(18,0,12,.97),
          rgba(74,8,51,.90) 38%,
          rgba(46,4,32,.92) 62%,
          rgba(18,0,12,.97));
      backdrop-filter: blur(16px) saturate(140%);
      -webkit-backdrop-filter: blur(16px) saturate(140%);
      box-shadow:
        0 18px 55px rgba(0,0,0,.28),
        inset 0 -1px rgba(255,255,255,.03);
      transition: min-height .3s ease, background .3s ease, box-shadow .3s ease;
    }

    header::after {
      content: "";
      position: absolute;
      left: 10%;
      right: 10%;
      bottom: -1px;
      height: 1px;
      background:
        linear-gradient(90deg,
          transparent,
          rgba(176,24,124,.62),
          rgba(252,177,68,.92),
          rgba(176,24,124,.62),
          transparent);
      filter: drop-shadow(0 0 8px rgba(252,177,68,.35));
      opacity: .72;
    }

    header.is-scrolled {
      min-height: 70px;
      background: rgba(18,0,12,.97);
      box-shadow: 0 16px 46px rgba(0,0,0,.32);
    }

    .logo-container {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .logo-container img {
      width: 50px;
      height: 50px;
      padding: 6px;
      object-fit: contain;
      border: 1px solid rgba(252,177,68,.34);
      border-radius: 16px;
      background:
        radial-gradient(circle at 30% 20%, rgba(255,255,255,.12), transparent 34%),
        rgba(255,255,255,.055);
      box-shadow:
        0 15px 34px rgba(0,0,0,.22),
        0 0 24px rgba(176,24,124,.12),
        inset 0 1px rgba(255,255,255,.12);
      animation: logoFloat 4.5s ease-in-out infinite;
    }

    @keyframes logoFloat {
      0%,100% { transform: translateY(0) rotate(0); }
      50% { transform: translateY(-3px) rotate(-1deg); }
    }

    .logo-container span {
      color: #fff;
      font-size: clamp(1rem, 1.65vw, 1.35rem);
      font-weight: 800;
      letter-spacing: -.02em;
      white-space: nowrap;
    }

    nav {
      display: flex;
      align-items: center;
      gap: 3px;
    }

    nav a {
      position: relative;
      color: #F2DCE9;
      text-decoration: none;
      font-weight: 700;
      font-size: .78rem;
      padding: 10px 10px;
      border-radius: 12px;
      transition: color .25s ease, background .25s ease, transform .25s ease;
    }

    nav a::after {
      content: "";
      position: absolute;
      left: 10px;
      right: 10px;
      bottom: 5px;
      height: 2px;
      border-radius: 99px;
      transform: scaleX(0);
      transform-origin: left;
      background: linear-gradient(90deg, var(--ary-magenta-2), var(--ary-orange));
      box-shadow: 0 0 10px rgba(252,177,68,.42);
      transition: transform .28s ease;
    }

    nav a:hover,
    nav a[href="ary_contacto.htm"] {
      color: #fff;
      background: rgba(255,255,255,.055);
    }

    nav a:hover {
      transform: translateY(-2px);
    }

    nav a:hover::after,
    nav a[href="ary_contacto.htm"]::after {
      transform: scaleX(1);
    }

    .menu-toggle {
      display: none;
      width: 46px;
      height: 46px;
      flex: 0 0 auto;
      padding: 0;
      border: 1px solid rgba(252,177,68,.22);
      border-radius: 14px;
      background: rgba(255,255,255,.05);
      color: #fff;
      cursor: pointer;
    }

    .menu-toggle span {
      width: 20px;
      height: 2px;
      display: block;
      margin: 4px auto;
      border-radius: 99px;
      background: currentColor;
      transition: transform .3s ease, opacity .3s ease;
    }

    .menu-toggle.active span:nth-child(1) { transform: translateY(6px) rotate(45deg); }
    .menu-toggle.active span:nth-child(2) { opacity: 0; }
    .menu-toggle.active span:nth-child(3) { transform: translateY(-6px) rotate(-45deg); }

    /* ================= MAIN / CONTACTO ================= */
    main {
      flex: 1;
      width: 100%;
      position: relative;
      overflow: hidden;
      isolation: isolate;
    }

    main::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -4;
      background:
        radial-gradient(circle at 50% 20%, rgba(176,24,124,.20), transparent 30%),
        radial-gradient(circle at 80% 42%, rgba(252,177,68,.08), transparent 22%),
        linear-gradient(180deg, rgba(22,0,15,.18), rgba(15,0,8,.82));
    }

    .hero-decor {
      position: absolute;
      inset: 0;
      z-index: -1;
      overflow: hidden;
      pointer-events: none;
    }

    .hero-decor .beam {
      position: absolute;
      left: -44%;
      width: 36vw;
      height: 4px;
      border-radius: 99px;
      opacity: .52;
      background:
        linear-gradient(90deg,
          transparent,
          rgba(176,24,124,.72),
          rgba(252,177,68,.95),
          transparent);
      box-shadow:
        0 0 12px rgba(176,24,124,.34),
        0 0 22px rgba(252,177,68,.20);
      animation: beamFly 6.6s linear infinite;
    }

    .hero-decor .beam:nth-child(1) { top: 18%; transform: rotate(-7deg); }
    .hero-decor .beam:nth-child(2) { top: 48%; transform: rotate(5deg); animation-delay: -2.2s; }
    .hero-decor .beam:nth-child(3) { top: 76%; transform: rotate(-4deg); animation-delay: -4.4s; }

    @keyframes beamFly {
      from { left: -45%; }
      to { left: 116%; }
    }

    .contact-shell {
      width: min(var(--container), calc(100% - 40px));
      min-height: calc(100svh - var(--header-h) - 170px);
      margin: 0 auto;
      padding: clamp(70px, 8vw, 110px) 0 clamp(78px, 8vw, 110px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      position: relative;
    }

    .contact-shell::before {
      content: "";
      position: absolute;
      z-index: -2;
      left: 50%;
      top: 52%;
      width: min(980px, 95vw);
      height: 650px;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background:
        radial-gradient(circle,
          rgba(176,24,124,.18) 0%,
          rgba(252,177,68,.05) 40%,
          transparent 72%);
      filter: blur(30px);
      pointer-events: none;
    }

    .contact-heading {
      max-width: 900px;
      margin: 0 auto clamp(38px, 5vw, 60px);
      text-align: center;
      position: relative;
    }

    .contact-heading::before {
      content: "";
      width: 48px;
      height: 3px;
      display: block;
      margin: 0 auto 17px;
      border-radius: 99px;
      background: linear-gradient(90deg, var(--ary-magenta-2), var(--ary-orange));
      box-shadow: 0 0 14px rgba(252,177,68,.40);
    }

    .contact-heading h1 {
      margin: 0;
      color: #fff;
      font-size: clamp(3rem, 6.4vw, 6.4rem);
      font-weight: 900;
      line-height: .94;
      letter-spacing: -.062em;
      text-wrap: balance;
      text-shadow:
        0 20px 55px rgba(0,0,0,.46),
        0 0 42px rgba(176,24,124,.13);
    }

    .contact-heading h1::after {
      content: "";
      width: min(310px, 48vw);
      height: 7px;
      margin: 28px auto 0;
      display: block;
      border-radius: 99px;
      background:
        linear-gradient(90deg,
          var(--ary-magenta),
          var(--ary-orange),
          var(--ary-gold),
          var(--ary-magenta));
      background-size: 220% 100%;
      box-shadow:
        0 0 14px rgba(176,24,124,.38),
        0 0 28px rgba(252,177,68,.30);
      animation: accentFlow 4s linear infinite;
    }

    @keyframes accentFlow {
      to { background-position: 220% 0; }
    }

    .contact-icons {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: clamp(18px, 2.5vw, 28px);
      position: relative;
    }

    .contact-icons::before {
      content: "";
      position: absolute;
      left: 8%;
      right: 8%;
      top: 50%;
      height: 2px;
      z-index: -1;
      transform: translateY(-50%);
      background:
        linear-gradient(90deg,
          transparent,
          rgba(176,24,124,.36),
          rgba(252,177,68,.55),
          rgba(176,24,124,.36),
          transparent);
      box-shadow: 0 0 16px rgba(252,177,68,.18);
    }

    .icon-box {
      min-width: 0;
      aspect-ratio: 1 / 1;
      min-height: 300px;
      display: grid;
      place-items: center;
      position: relative;
      overflow: hidden;
      isolation: isolate;
      border: 1px solid rgba(252,177,68,.20);
      border-radius: 34px;
      color: #fff;
      text-decoration: none;
      background:
        radial-gradient(circle at 88% 8%, rgba(252,177,68,.12), transparent 27%),
        radial-gradient(circle at 10% 90%, rgba(176,24,124,.15), transparent 35%),
        linear-gradient(155deg, rgba(71,7,49,.82), rgba(24,1,16,.96));
      backdrop-filter: blur(16px) saturate(130%);
      -webkit-backdrop-filter: blur(16px) saturate(130%);
      box-shadow:
        0 36px 100px rgba(0,0,0,.31),
        0 0 50px rgba(176,24,124,.055),
        inset 0 1px rgba(255,255,255,.08);
      opacity: 0;
      transform: translateY(30px);
      transition:
        opacity .8s ease,
        transform .8s cubic-bezier(.2,.8,.2,1),
        border-color .34s ease,
        box-shadow .34s ease;
    }

    .icon-box.is-visible {
      opacity: 1;
      transform: translateY(0);
    }

    .icon-box::before {
      content: "";
      position: absolute;
      inset: 9%;
      z-index: -1;
      border: 1px dashed rgba(252,177,68,.13);
      border-radius: 50%;
      animation: socialOrbit 18s linear infinite;
    }

    .icon-box:nth-child(2)::before {
      animation-direction: reverse;
      animation-duration: 22s;
    }

    .icon-box:nth-child(3)::before {
      animation-duration: 26s;
    }

    @keyframes socialOrbit {
      to { transform: rotate(360deg); }
    }

    .icon-box::after {
      content: attr(data-label);
      position: absolute;
      left: 18px;
      right: 18px;
      bottom: 18px;
      padding: 11px 13px;
      border: 1px solid rgba(255,255,255,.10);
      border-radius: 14px;
      color: #F5DFEB;
      background: rgba(23,0,15,.58);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      text-align: center;
      font-size: .72rem;
      font-weight: 800;
      letter-spacing: .12em;
      text-transform: uppercase;
      transition:
        color .3s ease,
        border-color .3s ease,
        background .3s ease;
    }

    .icon-box:hover {
      transform: translateY(-10px) scale(1.012);
      border-color: rgba(252,177,68,.42);
      box-shadow:
        0 48px 125px rgba(0,0,0,.40),
        0 0 58px rgba(176,24,124,.11),
        inset 0 1px rgba(255,255,255,.10);
    }

    .icon-box:hover::after {
      color: var(--ary-gold);
      border-color: rgba(252,177,68,.26);
      background: rgba(48,5,33,.68);
    }

    .icon-box img {
      width: min(32%, 108px);
      height: min(32%, 108px);
      object-fit: contain;
      object-position: center;
      position: relative;
      z-index: 3;
      filter:
        drop-shadow(0 16px 22px rgba(0,0,0,.30));
      transition:
        transform .5s cubic-bezier(.2,.8,.2,1),
        filter .35s ease;
    }

    .icon-box:hover img {
      transform: translateY(-8px) scale(1.14) rotate(-2deg);
      filter:
        saturate(1.12)
        brightness(1.06)
        drop-shadow(0 22px 28px rgba(0,0,0,.34));
    }

    .social-glow {
      position: absolute;
      z-index: 1;
      width: 58%;
      aspect-ratio: 1;
      border-radius: 50%;
      background:
        radial-gradient(circle,
          rgba(252,177,68,.14) 0%,
          rgba(215,42,147,.14) 34%,
          rgba(176,24,124,.055) 56%,
          transparent 74%);
      filter: blur(14px);
      opacity: .78;
      animation: socialGlow 4.8s ease-in-out infinite;
    }

    .icon-box:nth-child(2) .social-glow {
      animation-delay: -1.6s;
    }

    .icon-box:nth-child(3) .social-glow {
      animation-delay: -3.2s;
    }

    @keyframes socialGlow {
      0%,100% { transform: scale(.92); opacity: .65; }
      50% { transform: scale(1.08); opacity: 1; }
    }

    .corner {
      position: absolute;
      z-index: 4;
      width: 26px;
      height: 26px;
      pointer-events: none;
      opacity: .75;
    }

    .corner.tl {
      left: 18px;
      top: 18px;
      border-left: 2px solid var(--ary-orange);
      border-top: 2px solid var(--ary-orange);
    }

    .corner.br {
      right: 18px;
      bottom: 65px;
      border-right: 2px solid var(--ary-magenta-2);
      border-bottom: 2px solid var(--ary-magenta-2);
    }

    /* ================= FOOTER ================= */
    footer {
      padding: 34px 20px;
      position: relative;
      overflow: hidden;
      border-top: 1px solid rgba(252,177,68,.16);
      background:
        linear-gradient(180deg, rgba(22,0,15,.76), rgba(10,0,7,.96));
      color: #CFA5BC;
      font-size: .82rem;
    }

    footer::before {
      content: "";
      position: absolute;
      left: 50%;
      top: -150px;
      width: 520px;
      height: 260px;
      transform: translateX(-50%);
      border-radius: 50%;
      background: radial-gradient(circle, rgba(176,24,124,.13), transparent 70%);
      pointer-events: none;
    }

    footer p {
      position: relative;
      max-width: 900px;
      margin: 8px auto;
      text-align: center;
      line-height: 1.7;
    }

    footer a {
      position: relative;
      display: inline-block;
      margin: 0 5px;
      padding: 5px 0;
      color: var(--ary-orange);
      text-decoration: none;
      font-weight: 700;
    }

    footer a::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: 1px;
      height: 2px;
      transform: scaleX(0);
      transform-origin: left;
      background: linear-gradient(90deg, var(--ary-magenta-2), var(--ary-orange));
      transition: transform .28s ease;
    }

    footer a:hover {
      color: #fff;
    }

    footer a:hover::after {
      transform: scaleX(1);
    }

    footer strong {
      color: #fff;
    }

    /* ================= RESPONSIVE ================= */
    @media (max-width: 1080px) {
      nav a {
        padding-inline: 7px;
        font-size: .72rem;
      }

      .contact-shell {
        width: min(100% - 30px, var(--container));
      }

      .icon-box {
        min-height: 280px;
      }
    }

    @media (max-width: 900px) {
      :root { --header-h: 74px; }

      header {
        padding-inline: 16px;
      }

      .menu-toggle {
        display: block;
      }

      nav {
        position: fixed;
        inset: calc(var(--header-h) + 8px) 14px auto;
        display: grid;
        gap: 6px;
        padding: 14px;
        border: 1px solid rgba(252,177,68,.18);
        border-radius: 20px;
        background: rgba(28,1,19,.97);
        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);
        box-shadow: 0 28px 80px rgba(0,0,0,.38);
        opacity: 0;
        visibility: hidden;
        transform: translateY(-14px) scale(.985);
        transform-origin: top;
        transition: opacity .28s ease, transform .28s ease, visibility .28s ease;
      }

      nav.open {
        opacity: 1;
        visibility: visible;
        transform: translateY(0) scale(1);
      }

      nav a {
        padding: 12px 13px;
        text-align: left;
        font-size: .83rem;
      }

      .cursor-energy {
        display: none;
      }

      .contact-icons {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .contact-icons .icon-box:last-child {
        grid-column: 1 / -1;
        width: min(100%, 430px);
        justify-self: center;
      }

      .contact-icons::before {
        display: none;
      }

      .hero-decor .beam {
        width: 54vw;
        opacity: .30;
      }
    }

    @media (max-width: 640px) {
      :root { --header-h: 70px; }

      body {
        background:
          radial-gradient(circle at 10% 5%, rgba(176,24,124,.16), transparent 26%),
          radial-gradient(circle at 95% 18%, rgba(252,177,68,.07), transparent 22%),
          linear-gradient(180deg, #16000F 0%, #220216 52%, #100008 100%);
      }

      header {
        min-height: var(--header-h);
        padding: 10px 12px;
        gap: 10px;
      }

      header.is-scrolled {
        min-height: 66px;
      }

      .logo-container {
        gap: 9px;
      }

      .logo-container img {
        width: 44px;
        height: 44px;
        border-radius: 14px;
        animation: none;
      }

      .logo-container span {
        max-width: 190px;
        overflow: hidden;
        text-overflow: ellipsis;
        font-size: .86rem;
      }

      .menu-toggle {
        width: 44px;
        height: 44px;
        border-radius: 13px;
      }

      nav {
        inset: calc(var(--header-h) + 7px) 10px auto;
        max-height: calc(100svh - var(--header-h) - 22px);
        overflow-y: auto;
        overscroll-behavior: contain;
      }

      nav a {
        min-height: 44px;
        display: flex;
        align-items: center;
      }

      .hero-decor .beam:nth-child(2),
      .hero-decor .beam:nth-child(3) {
        display: none;
      }

      .hero-decor .beam:first-child {
        width: 70vw;
        opacity: .20;
      }

      .contact-shell {
        width: calc(100% - 20px);
        min-height: auto;
        padding: 60px 0 72px;
      }

      .contact-heading {
        margin-bottom: 30px;
      }

      .contact-heading h1 {
        font-size: clamp(2.45rem, 12vw, 3.75rem);
        line-height: .96;
      }

      .contact-heading h1::after {
        width: min(210px, 52vw);
        height: 4px;
        margin-top: 21px;
      }

      .contact-icons {
        grid-template-columns: 1fr;
        gap: 16px;
      }

      .contact-icons .icon-box:last-child {
        grid-column: auto;
        width: 100%;
      }

      .icon-box {
        width: 100%;
        min-height: 0;
        aspect-ratio: auto;
        height: 190px;
        display: grid;
        grid-template-columns: 105px 1fr;
        justify-items: center;
        padding: 18px;
        border-radius: 24px;
      }

      .icon-box::before {
        width: 120px;
        height: 120px;
        inset: auto;
        left: 10px;
        top: 50%;
        transform: translateY(-50%);
      }

    /* =========================================================
       CONTACTO SIGNATURE BENTO — CIERRE PREMIUM DEL SITIO

    .contact-bento {

      gap: clamp(18px, 2.2vw, 28px);

      position: relative;
    }

    .contact-bento::before {
      content: "";

      z-index: -2;

      top: 50%;

      height: 520px;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background:
        radial-gradient(circle,

    .contact-social-stack {

      grid-template-rows: repeat(2, minmax(0, 1fr));
      gap: clamp(18px, 2.2vw, 28px);
    }

    /* Base refinada */
    .contact-bento .icon-box {
      width: 100%;
      min-width: 0;
      min-height: 0;
      aspect-ratio: auto;
      display: grid;
      place-items: center;
      position: relative;
      overflow: hidden;
      isolation: isolate;
      border-radius: 34px;
    }

    .contact-bento .icon-box::before {
      inset: 10%;
      border-style: solid;
      border-color: rgba(252,177,68,.11);
      animation-duration: 20s;
    }

    .contact-bento .icon-box::after {
      left: 24px;
      right: 24px;
      bottom: 24px;
      min-height: 50px;
      display: grid;
      place-items: center;
      padding: 12px 14px;
      border-color: rgba(252,177,68,.16);
      background:
        linear-gradient(145deg,
          rgba(31,1,21,.74),
          rgba(70,7,49,.54));
      box-shadow:
        0 14px 34px rgba(0,0,0,.16),
        inset 0 1px rgba(255,255,255,.05);
      letter-spacing: .15em;
    }

    .contact-image-wrap {
      width: 48%;
      max-width: 210px;
      aspect-ratio: 1;
      display: grid;
      place-items: center;
      position: relative;
      z-index: 4;
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 50%;
      background:
        radial-gradient(circle at 36% 28%, rgba(255,255,255,.11), transparent 32%),
        linear-gradient(145deg,
          rgba(255,255,255,.065),
          rgba(255,255,255,.018));
      box-shadow:
        0 28px 70px rgba(0,0,0,.24),
        0 0 38px rgba(176,24,124,.08),
        inset 0 1px rgba(255,255,255,.08);
      transition:
        transform .55s cubic-bezier(.2,.8,.2,1),
        box-shadow .35s ease,
        border-color .35s ease;
    }

    .contact-image-wrap::before {
      content: "";
      position: absolute;
      inset: -10%;
      z-index: -1;
      border: 1px dashed rgba(252,177,68,.15);
      border-radius: 50%;
      animation: imageOrbit 18s linear infinite;
    }

    @keyframes imageOrbit {
      to { transform: rotate(360deg); }
    }

    .contact-bento .icon-box img {
      width: 48%;
      height: 48%;
      max-width: none;
      object-fit: contain;
      position: relative;
      z-index: 2;

    .contact-bento .icon-box:hover .contact-image-wrap {
      transform: translateY(-9px) scale(1.04);
      border-color: rgba(252,177,68,.25);

    /* Correo protagonista */

    .contact-primary::after {

    .contact-primary .contact-image-wrap {

    .contact-secondary {

      padding: 26px;
      justify-items: center;

        linear-gradient(155deg, rgba(69,7,48,.84), rgba(23,1,15,.97)) !important;

    .contact-secondary::after {
      position: static !important;

      grid-row: 1;

    /* Anillos de señal decorativos */
    .signal-ring {
      position: absolute;
      z-index: 1;
      border: 1px solid rgba(252,177,68,.12);

    .signal-ring.ring-one {

      box-shadow:
        0 0 0 36px rgba(176,24,124,.022),

    @keyframes signalDrift {
      0%,100% { transform: translateY(0) rotate(0); opacity: .55; }

    /* Conector luminoso entre bento */

      .contact-primary::after,

      .contact-primary::before,

      }

        inset: -8%;
      }

      .signal-ring {

    }

    @media (max-width: 390px) {

    }

    @media (prefers-reduced-motion: reduce) {
      .signal-ring,

  <script>
    (() => {
      "use strict";

      const header = document.querySelector("header");
      const nav = document.querySelector("header nav");
      const toggle = document.querySelector(".menu-toggle");
      const progress = document.querySelector(".scroll-progress");
      const cursorEnergy = document.querySelector(".cursor-energy");

      const updateScroll = () => {
        const y = window.scrollY || 0;
        header?.classList.toggle("is-scrolled", y > 24);

        const max = document.documentElement.scrollHeight - window.innerHeight;
        if (progress) {
          progress.style.width = max > 0
            ? `${Math.min(100, (y / max) * 100)}%`
            : "0%";
        }
      };

      window.addEventListener("scroll", updateScroll, { passive: true });
      updateScroll();

      toggle?.addEventListener("click", () => {
        const open = nav?.classList.toggle("open");
        toggle.classList.toggle("active", Boolean(open));
        toggle.setAttribute("aria-expanded", String(Boolean(open)));
      });

      nav?.querySelectorAll("a").forEach((link) => {
        link.addEventListener("click", () => {
          nav.classList.remove("open");
          toggle?.classList.remove("active");
          toggle?.setAttribute("aria-expanded", "false");
        });
      });

      document.addEventListener("click", (event) => {
        if (!nav?.classList.contains("open")) return;
        if (nav.contains(event.target) || toggle?.contains(event.target)) return;

        nav.classList.remove("open");
        toggle?.classList.remove("active");
        toggle?.setAttribute("aria-expanded", "false");
      });

      // Reveal de tarjetas de contacto.
      const cards = document.querySelectorAll(".icon-box");

      if ("IntersectionObserver" in window) {
        const observer = new IntersectionObserver((entries, obs) => {
          entries.forEach((entry) => {
            if (!entry.isIntersecting) return;
            entry.target.classList.add("is-visible");
            obs.unobserve(entry.target);
          });
        }, { threshold: .14 });

        cards.forEach((card, index) => {
          card.style.transitionDelay = `${index * 90}ms`;
          observer.observe(card);
        });
      } else {
        cards.forEach((card) => card.classList.add("is-visible"));
      }

      // Halo de cursor.
      if (cursorEnergy && matchMedia("(pointer:fine)").matches) {
        document.addEventListener("pointermove", (event) => {
          cursorEnergy.style.left = `${event.clientX}px`;
          cursorEnergy.style.top = `${event.clientY}px`;
          cursorEnergy.style.opacity = "1";
        }, { passive: true });

        document.addEventListener("pointerleave", () => {
          cursorEnergy.style.opacity = "0";
        });
      }

      // Spotlight en tarjetas de contacto.
      cards.forEach((card) => {
        if (!matchMedia("(pointer:fine) and (min-width: 901px)").matches) return;

        card.addEventListener("pointermove", (event) => {
          const rect = card.getBoundingClientRect();
          const x = ((event.clientX - rect.left) / rect.width) * 100;
          const y = ((event.clientY - rect.top) / rect.height) * 100;

          card.style.backgroundImage = `
            radial-gradient(circle at ${x}% ${y}%,
              rgba(252,177,68,.14),
              rgba(215,42,147,.06) 23%,
              transparent 43%),
            radial-gradient(circle at 88% 8%,
              rgba(252,177,68,.12),
              transparent 27%),
            radial-gradient(circle at 10% 90%,
              rgba(176,24,124,.15),
              transparent 35%),
            linear-gradient(155deg,
              rgba(71,7,49,.84),
              rgba(24,1,16,.97))
          `;
        });

        card.addEventListener("pointerleave", () => {
          card.style.backgroundImage = "";
        });
      });

      // Partículas ARY; desactivadas en móvil pequeño y ahorro de datos.
      const canvas = document.getElementById("ary-particles");
      const ctx = canvas?.getContext("2d");
      const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
      const saveData = navigator.connection?.saveData === true;
      const smallMobile = matchMedia("(max-width: 640px)").matches;

      if (canvas && ctx && !reduceMotion && !saveData && !smallMobile) {
        let width = 0;
        let height = 0;
        let dpr = 1;
        let particles = [];
        const pointer = { x: -9999, y: -9999 };

        const resize = () => {
          width = window.innerWidth;
          height = window.innerHeight;
          dpr = Math.min(window.devicePixelRatio || 1, 2);

          canvas.width = Math.floor(width * dpr);
          canvas.height = Math.floor(height * dpr);
          canvas.style.width = `${width}px`;
          canvas.style.height = `${height}px`;
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

          const count = Math.max(
            28,
            Math.min(72, Math.floor((width * height) / 28000))
          );

          particles = Array.from({ length: count }, (_, index) => ({
            x: Math.random() * width,
            y: Math.random() * height,
            vx: (Math.random() - .5) * .30,
            vy: (Math.random() - .5) * .30,
            r: Math.random() * 1.5 + .6,
            orange: index % 4 === 0
          }));
        };

        window.addEventListener("resize", resize, { passive: true });

        window.addEventListener("pointermove", (event) => {
          pointer.x = event.clientX;
          pointer.y = event.clientY;
        }, { passive: true });

        const draw = () => {
          ctx.clearRect(0, 0, width, height);

          for (let i = 0; i < particles.length; i++) {
            const p = particles[i];

            p.x += p.vx;
            p.y += p.vy;

            if (p.x < -10) p.x = width + 10;
            if (p.x > width + 10) p.x = -10;
            if (p.y < -10) p.y = height + 10;
            if (p.y > height + 10) p.y = -10;

            const dxp = p.x - pointer.x;
            const dyp = p.y - pointer.y;
            const pd = Math.hypot(dxp, dyp);

            if (pd < 100 && pd > .1) {
              p.x += (dxp / pd) * .45;
              p.y += (dyp / pd) * .45;
            }

            ctx.beginPath();
            ctx.fillStyle = p.orange
              ? "rgba(252,177,68,.72)"
              : "rgba(215,42,147,.56)";
            ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
            ctx.fill();

            for (let j = i + 1; j < particles.length; j++) {
              const q = particles[j];
              const dx = p.x - q.x;
              const dy = p.y - q.y;
              const distance = Math.hypot(dx, dy);

              if (distance < 100) {
                ctx.beginPath();
                ctx.strokeStyle =
                  `rgba(244,177,212,${(1 - distance / 100) * .09})`;
                ctx.lineWidth = .7;
                ctx.moveTo(p.x, p.y);
                ctx.lineTo(q.x, q.y);
                ctx.stroke();
              }
            }
          }

          requestAnimationFrame(draw);
        };

        resize();
        draw();
      }
    })();
  </script>
